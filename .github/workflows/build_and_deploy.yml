name: Build and Deploy Spring Boot App on AWS Lightsail

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add SSH Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync project to server
        run: |
          rsync -avz --delete \
            --exclude "target" \
            --exclude ".git" \
            --exclude ".env" \
            --exclude ".env.*" \
            --exclude "postgres_data" \
            ./ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.WORK_DIR_DOCKER }}/

      - name: Deploy via Docker Compose
        run: |
          REVISION=$(git describe --tags --always)
          
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            docker network create reserve_net || true &&
            cd ${{ secrets.WORK_DIR_DOCKER }} &&
            REVISION=${REVISION} docker compose -f docker-compose.prod.yml  --env-file /opt/reserve/.env \
              up -d --build --remove-orphans api
          "

      - name: Show containers status
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "cd ${{ secrets.WORK_DIR_DOCKER }} && docker-compose ps"

      - name: Cleanup
        run: rm -rf ~/.ssh