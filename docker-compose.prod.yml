services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        REVISION: ${REVISION:-0.0.1-SNAPSHOT}
    container_name: reserve-api
    restart: unless-stopped
    ports:
      - "8443:8443"
    depends_on:
      postgres:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      RESERVE_TOKENS_SECRET: ${RESERVE_TOKENS_SECRET}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:+UnlockDiagnosticVMOptions -XX:-UseBASE64Intrinsics}
      SPRING_PROFILES_ACTIVE: prod
    networks:
      - reserve_net

  postgres:
    image: postgres:16-alpine
    container_name: reserve-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U reserve -d reserve" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - reserve_net

volumes:
  postgres_data:

networks:
  reserve_net:
    name: reserve_net
    driver: bridge